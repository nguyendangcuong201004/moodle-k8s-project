name: Build, Push & Deploy Moodle

on:
  push:
    branches: ["develop"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - deploy-production
          - staging-teardown
      image_tag:
        description: "Image tag to deploy (e.g., v1.1.0 or sha-abc1234). Required for deploy-production."
        required: false
        type: string

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Build and push Docker image
  # Trigger: push to develop or main, or version tags
  # ──────────────────────────────────────────────
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.short_sha.outputs.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: short_sha
        run: echo "sha=sha-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ndcuongdevops/moodle-lms
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
            type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────
  # JOB 2: Deploy to staging (auto on push to develop)
  # ──────────────────────────────────────────────
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Get kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ vars.DO_STAGING_CLUSTER }}

      - name: Deploy to staging
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          echo "Deploying image tag: $IMAGE_TAG to staging"

          kubectl set image deployment/moodle \
            moodle=ndcuongdevops/moodle-lms:${IMAGE_TAG}

          kubectl scale deployment/moodle --replicas=1
          kubectl rollout status deployment/moodle --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods
          echo "=== Service ==="
          kubectl get svc
          echo ""
          echo "Staging URL: ${{ vars.MOODLE_STAGING_WWWROOT }}"

  # ──────────────────────────────────────────────
  # JOB 3: Deploy to production (manual trigger)
  # Trigger: workflow_dispatch from main branch
  # ──────────────────────────────────────────────
  deploy-production:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy-production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ github.event.inputs.image_tag }}" ]; then
            echo "ERROR: image_tag is required for deploy-production"
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Get kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ vars.DO_PRODUCTION_CLUSTER }}

      - name: Deploy to production
        run: |
          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          echo "Deploying image tag: $IMAGE_TAG"

          # Rolling update - zero downtime
          kubectl set image deployment/moodle \
            moodle=ndcuongdevops/moodle-lms:${IMAGE_TAG}

          # Wait for rollout
          kubectl rollout status deployment/moodle --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods
          echo "=== Service ==="
          kubectl get svc
          echo ""
          echo "Production URL: ${{ vars.MOODLE_WWWROOT }}"

  # ──────────────────────────────────────────────
  # JOB 4: Teardown staging (manual trigger)
  # ──────────────────────────────────────────────
  staging-teardown:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'staging-teardown'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Get kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ vars.DO_STAGING_CLUSTER }}

      - name: Scale down
        run: |
          echo "Scaling down to save resources..."
          kubectl scale deployment/moodle --replicas=0
          echo "Scaled to 0 replicas."
